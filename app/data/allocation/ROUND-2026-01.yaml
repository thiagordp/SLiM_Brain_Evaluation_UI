# Allocation for ROUND-2026-01 — DEVELOPMENT ALLOCATION.
#
# This is NOT the accepted scientific allocation. It exists so the round can be
# bootstrapped and exercised end to end while one Source (the 26th) is still
# missing from the Brain. The choice of Agreement and Individual papers is
# arbitrary but deterministic:
#
#   training   the two agreed Training papers, resolved by title in the Brain
#   agreement  the first six remaining Sources in ascending id order, two per pair
#   individual the other seventeen in ascending id order, in consecutive blocks
#              of three per evaluator, in the evaluator order below; the last
#              evaluator (Alessandro) temporarily has two.
#
# When the 26th Source is in the Brain, add it to IND-6 (Alessandro), giving
# every evaluator three Individual papers, then regenerate:
#
#   python app/tools/build_assignments.py
#
# Titles are checked against the Brain: a Source renumbered between snapshots is
# reported instead of silently assigning a different paper.
